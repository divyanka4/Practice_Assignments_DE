# This is a Declarative Automation Bundle definition for dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabs
  uuid: 458d0563-ad78-48b7-a8f1-1f6a7f751e33

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-09bdc850-08ea.cloud.databricks.com
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-3b84353a-a1b3.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/paldivya0222@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/be9a2f2a-2586-4127-8138-4bdc62efebb4/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      schema: bronze

    run_as:
      service_principal_name: "be9a2f2a-2586-4127-8138-4bdc62efebb4"

    permissions:
      - user_name: paldivya0222@gmail.com
        level: CAN_MANAGE
      - service_principal_name: "be9a2f2a-2586-4127-8138-4bdc62efebb4"
        level : CAN_MANAGE
